services:
  web:
    image: aps_web:latest
    volumes:
      - ./web:/app
    tty: true
    ports:
      - "${PORT:-3000}:3000"
    env_file:                   
      - ./.env
    restart: unless-stopped # 除非手動停止，否則異常停止會自動重啟 適合 server 類型的服務

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554" # RTSP
      - "8080:8080" # HTTP

  # cam1:
  #   image: rtsp:v_3
