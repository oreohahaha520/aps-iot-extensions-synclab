services:
  web:
    image: aps_web:latest
    volumes:
      - ./web:/app
    tty: true
    ports:
      - "${PORT:-3000}:3000"
    env_file:                   
      - ./.env
    restart: unless-stopped # 除非手動停止，否則異常停止會自動重啟 適合 server 類型的服務

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554" # RTSP
      - "8080:8080" # HTTP

  cam1:
    image: rtsp:latest
    depends_on:
      - mediamtx
    volumes:
      - ./rtsp/src/cctv/:/app/cctv/
    env_file:
      - ./.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp
    working_dir: /app
    # 執行 python3 程式並傳遞 CLI 參數
    command: ["python3", "yolo-rtsp-security-cam.py", "--stream", "${STREAM_URL}"]

